#:schema node_modules/wrangler/config-schema.json

name = "manhali-analytics"
main = "src/index.ts"
account_id = "53fb41ede04e54b276ce3fd9bfd270b6"
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "analytics.worker.manhali.com"
zone_name = "manhali.com"
custom_domain = true

# No [triggers]/crons: Analytics Engine has built-in 90-day retention, so there
# is no scheduled rollup/cleanup work. The worker exports only fetch(); a cron
# trigger with no scheduled() handler would fire daily with nothing to run.
#
# The unauthenticated POST /api/collect endpoint is intentionally not
# rate-limited in-worker (see ANALYTICS_ARCHITECTURE.md). Configure abuse
# protection at the edge — a Cloudflare Rate Limiting rule scoped to
# /api/collect — for production traffic.

[observability]
enabled = true
head_sampling_rate = 1

# ─── Analytics Engine ─────────────────────────────────────────────────────────
# Dataset is auto-created on first writeDataPoint() call.

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "manhali_analytics"

# ─── KV Namespace (Domain allowlist) ──────────────────────────────────────────

[[kv_namespaces]]
binding = "DOMAINS_KV"
id = "e2809ede5e784984b34d6c85a16465bd"

# ─── Environment variables ────────────────────────────────────────────────────
# Secrets (set via `wrangler secret put`):
#   AUTH_TOKEN          — Bearer token for authenticated API access
#   CF_API_TOKEN        — Cloudflare API token for Analytics Engine SQL queries
#   FINGERPRINT_SECRET  — HMAC secret for visitor hash (separate from AUTH_TOKEN)

[vars]
ENVIRONMENT = "production"
ACCOUNT_ID = "53fb41ede04e54b276ce3fd9bfd270b6"
ALLOW_UNREGISTERED_DOMAINS = "false"

# ─── Dev settings ─────────────────────────────────────────────────────────────
[dev]
port = 8790
