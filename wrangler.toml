#:schema node_modules/wrangler/config-schema.json

name = "manhali-analytics"
main = "src/index.ts"
account_id = "53fb41ede04e54b276ce3fd9bfd270b6"
workers_dev = false
preview_urls = false
compatibility_date = "2026-05-29"
compatibility_flags = ["nodejs_compat"]

[limits]
cpu_ms = 500

[[routes]]
pattern = "analytics.worker.manhali.com"
zone_name = "manhali.com"
custom_domain = true

# ─── Triggers ─────────────────────────────────────────────────────────────────
# Explicitly disabled. Cloudflare only *removes* a Cron Trigger when the config
# sets `crons = []`; omitting or commenting out the key leaves an existing
# trigger attached to the deployed Worker. Analytics Engine has built-in 90-day
# retention, so there is no scheduled rollup/cleanup work, and this Worker
# exports no scheduled() handler.
[triggers]
crons = []

# A normal page lifecycle emits a pageview and one beacon. The IP quota allows
# 150 complete lifecycles/minute per Cloudflare location, sized so visitors
# behind shared/NAT client IPs do not throttle each other. Limits are
# per-location and eventually consistent: treat them as an approximate abuse
# bound, not exact accounting. Site/origin quota runs before domain KV
# resolution and caps a hot tenant/origin at 600 complete lifecycles/minute per
# location. Authenticated ingest skips both public limits. Query reads have
# their own tenant+token quota (60/min scoped, 240/min admin) plus a 60/min
# per-IP quota on failed auth. Namespace IDs are unique across environments.

[[ratelimits]]
name = "COLLECT_RATE_LIMIT"
namespace_id = "1101"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "SITE_COLLECT_RATE_LIMIT"
namespace_id = "1102"
simple = { limit = 1200, period = 60 }

[[ratelimits]]
name = "QUERY_RATE_LIMIT"
namespace_id = "1103"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "QUERY_RATE_LIMIT_ADMIN"
namespace_id = "1104"
simple = { limit = 240, period = 60 }

[observability]
enabled = true
head_sampling_rate = 0.05

[observability.logs]
enabled = true
head_sampling_rate = 0.05
invocation_logs = false

# ─── Analytics Engine ─────────────────────────────────────────────────────────
# Dataset is auto-created on first writeDataPoint() call.

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "manhali_analytics"

# ─── KV Namespace (Domain allowlist) ──────────────────────────────────────────

[[kv_namespaces]]
binding = "DOMAINS_KV"
id = "e2809ede5e784984b34d6c85a16465bd"

# ─── Environment variables ────────────────────────────────────────────────────
# Secrets (set via `wrangler secret put`):
#   AUTH_TOKEN          — Bearer token for authenticated API access (required)
#   CF_API_TOKEN        — Cloudflare API token for Analytics Engine SQL queries
#   FINGERPRINT_SECRET  — Salt for visitor hash (required; separate from AUTH_TOKEN)

[vars]
ENVIRONMENT = "production"
ACCOUNT_ID = "53fb41ede04e54b276ce3fd9bfd270b6"
ALLOW_UNREGISTERED_DOMAINS = "false"
ANALYTICS_DATASET = "manhali_analytics"

# ─── Dev settings ─────────────────────────────────────────────────────────────
[dev]
port = 8790

# ─── Sandbox account (a793ff57a25dfe6874a8738f9addd295) ───────────────────────
# Deploy: wrangler deploy --env sandbox  (OAuth multi-account; no prod CF token)
[env.sandbox]
name = "manhali-analytics-sandbox"
account_id = "a793ff57a25dfe6874a8738f9addd295"
workers_dev = true
preview_urls = true
# The sandbox's own host. The tenant Worker's `*.manhali.dev/*` wildcard is a Route, and Routes run before
# Custom Domains, so a more-specific zone Route keeps this host here (as dash/api do). workers.dev stays on
# as a backup host.
routes = [
  { pattern = "analytics.manhali.dev", custom_domain = true },
  { pattern = "analytics.manhali.dev/*", zone_name = "manhali.dev" },
]

[env.sandbox.limits]
# The Sandbox account uses Workers Free, which rejects any explicit CPU limit.
# Keep this empty to override the inheritable paid-production limit above.

[[env.sandbox.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "manhali_analytics_sandbox"

[[env.sandbox.kv_namespaces]]
binding = "DOMAINS_KV"
id = "4297ecdc81f6418ca37d2a05a94f5bf1"

[env.sandbox.vars]
ENVIRONMENT = "staging"
ACCOUNT_ID = "a793ff57a25dfe6874a8738f9addd295"
ALLOW_UNREGISTERED_DOMAINS = "true"
ANALYTICS_DATASET = "manhali_analytics_sandbox"

[[env.sandbox.ratelimits]]
name = "COLLECT_RATE_LIMIT"
namespace_id = "2101"
simple = { limit = 300, period = 60 }

[[env.sandbox.ratelimits]]
name = "SITE_COLLECT_RATE_LIMIT"
namespace_id = "2102"
simple = { limit = 1200, period = 60 }

[[env.sandbox.ratelimits]]
name = "QUERY_RATE_LIMIT"
namespace_id = "2103"
simple = { limit = 60, period = 60 }

[[env.sandbox.ratelimits]]
name = "QUERY_RATE_LIMIT_ADMIN"
namespace_id = "2104"
simple = { limit = 240, period = 60 }

[env.sandbox.observability]
enabled = true
head_sampling_rate = 0.1

[env.sandbox.observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = false
